name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Install backend dependencies
        run: bun install --cwd backend --frozen-lockfile

      - name: Scan for security vulnerabilities in backend dependencies
        working-directory: backend
        run: bun audit

      - name: Typecheck
        run: bun run --cwd backend typecheck

      - name: Run backend tests
        run: bun run --cwd backend test

  sidecar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Install backend dependencies
        run: bun install --cwd backend --frozen-lockfile

      - name: Typecheck and test build scripts
        run: bun run scripts:typecheck && bun run scripts:test

      - name: Compile the server for this runner
        run: bun scripts/build-server.ts

      # Runs the binary from a temp dir with env vars only, as the desktop app does.
      - name: Boot the compiled server outside the repository
        run: bun scripts/smoke-server.ts

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Run frontend tests
        run: npm --prefix frontend run test

      - name: Build frontend
        run: npm --prefix frontend run build
