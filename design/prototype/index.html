}

/* ───────────────────────── Inspector ───────────────────────── */
function renderInspector() {
  const el = document.getElementById('inspector')
  const p = byId(S.selected)
  if (!S.inspector || !p || S.hero) { el.innerHTML = ''; return }
  let body = ''
  if (S.inspTab === 'activity') {
    const ev = [
      ['branch', 'var(--t2)', `<b>${p.author}</b> opened this pull request`, p.updated - 30 * H],
      p.requested ? ['user', 'var(--accent)', 'Review requested from you', p.updated - 29 * H] : null,
      ['refresh', 'var(--t2)', 'Synced from GitHub', S.syncedAt],
      p.run ? ['sparkles', 'var(--accent)', `${AGENTS[p.agent].label} finished · ${(p.findings || []).length} findings in ${p.run.duration}`, p.run.at] : null,
      p.state === 'reviewing' ? ['sparkles', 'var(--accent)', `${AGENTS[p.agent].label} started reviewing`, p.startedAt] : null,
      p.state === 'failed' ? ['warn', 'var(--red)', `Review failed · attempt ${p.attempts}`, NOW - 3 * H] : null,
      p.submitted ? ['github', 'var(--purple)', `You ${p.submitted.event === 'APPROVE' ? 'approved' : p.submitted.event === 'COMMENT' ? 'commented' : 'requested changes'} on GitHub`, p.submitted.at] : null,
      p.newCommits ? ['branch', 'var(--purple)', `<b>${p.author}</b> pushed ${p.newCommits} commits`, p.updated] : null,
    ].filter(Boolean).sort((a, b) => b[3] - a[3])
    body = `<div class="tl">${ev.map(([ic, c, what, ts]) => `<div class="tl-item"><span class="tl-dot" style="--c:${c}">${icon(ic, 12)}</span><div><div class="what">${what}</div><div class="when">${agoLong(ts)}</div></div></div>`).join('')}</div>`
  } else if (S.inspTab === 'files') {
    const max = Math.max(...p.fileList.map((f) => f.a + f.d))
    body = p.fileList.map((f) => {
      const total = f.a + f.d
      const blocks = Math.max(1, Math.round((total / max) * 5))
      const adds = Math.round((f.a / Math.max(total, 1)) * blocks)
      const bars = Array.from({ length: 5 }, (_, i) => `<i class="${i < adds ? 'a' : i < blocks ? 'd' : ''}"></i>`).join('')
      const hits = (p.findings || []).filter((x) => x.file === f.path).length
      return `<div class="file-row">${icon('file', 13)}<span class="p" title="${f.path}">${f.path}</span><span style="display:flex;align-items:center;gap:6px">${hits ? `<span class="chip" style="--c:var(--accent)">${hits}</span>` : ''}<span class="bars">${bars}</span></span></div>`
    }).join('')
  } else {
    const lines = (S.logs[p.id]?.lines?.length ? S.logs[p.id].lines : p.run ? [['status', 'Preparing worktree'], ['ok', `Checked out ${p.head}`], ['status', `Reading diff · ${p.fileList.length} files`], ...p.fileList.map((f) => ['out', f.path]), ['status', 'Reviewing changes'], ['status', 'Writing findings'], ['ok', `${(p.findings || []).length} findings · ${p.run.duration}`]] : [['out', 'No runs yet.']])
    body = `<div class="full-log">${lines.map(([t, l]) => `<div class="ln ${t}">${t === 'status' ? '→ ' : t === 'ok' ? '✓ ' : '  '}${esc(l)}</div>`).join('')}</div>`
  }
  el.innerHTML = `<div class="toolbar"><div class="seg">${[['activity', 'Activity'], ['files', 'Files'], ['log', 'Agent log']].map(([k, l]) => `<button class="${S.inspTab === k ? 'on' : ''}" data-act="insp-tab" data-id="${k}">${l}</button>`).join('')}</div></div><div class="insp-body">${body}</div>`
}

/* ───────────────────────── Render ───────────────────────── */
function render() {
  document.documentElement.dataset.theme = S.theme
  document.documentElement.style.setProperty('--accent', S.accent)
  const win = document.getElementById('window')
  win.classList.toggle('no-sidebar', !S.sidebar)
  win.classList.toggle('with-inspector', S.inspector && !S.hero)
  renderSidebar(); renderList(); renderDetail(); renderInspector()
}
function autosize() {
  const t = document.getElementById('composer-input')
  if (!t) return
  t.style.height = 'auto'
  t.style.height = Math.min(t.scrollHeight, 160) + 'px'
}

/* ───────────────────────── Simulation ───────────────────────── */
function genericScript(p) {
  return [
    ['status', `Preparing worktree ~/.ordem/worktrees/${repoOf(p).name}-${p.num}`],
    ['ok', `Checked out ${p.head} @ ${Math.random().toString(16).slice(2, 9)}`],
    ['status', `Reading diff · ${p.fileList.length} files, +${fmtN(p.add)} −${fmtN(p.del)}`],
    ...p.fileList.slice(0, 3).map((f) => ['out', f.path]),
    ['status', p.depth === 'swarm' ? 'Swarm · spawned 3 reviewers' : 'Reviewing changes'],
    ['out', 'Tracing error handling on new code paths'],
    ['out', 'Checking tests cover the new branches'],
    ['out', `Comparing behavior against ${p.base}`],
    ['status', 'Writing findings'],
  ]
}
function genericFindings(p) {
  const [a, b] = p.fileList
  return [
    { id: p.id * 100 + 1, sev: 'major', on: true, title: 'Error from the external call is swallowed', file: a.path, line: 42, body: 'The <code>rescue</code> logs and returns <code>nil</code>, so callers can’t tell a failure from an empty result. Re-raise, or return a result object.' },
    { id: p.id * 100 + 2, sev: 'minor', on: true, title: 'New branch has no test', file: (b || a).path, line: 17, body: 'The early-return path added here isn’t exercised by any spec.' },
    { id: p.id * 100 + 3, sev: 'nit', on: false, title: 'Unused variable', file: a.path, line: 88, body: '<code>result</code> is assigned but never read.' },
  ]
}

function startReview(p, focus) {
  p.focus = focus || ''
  p.agent = p.agent || S.defaultAgent
  p.depth = p.depth || S.defaultDepth
  p.lens = p.lens || 'general'
  const running = PRS.some((x) => x.state === 'reviewing' && x.id !== p.id)
  if (running) {
    p.state = 'queued'
    p.queuePos = PRS.filter((x) => x.state === 'queued').length + 1
    notify('Added to queue', `#${p.num} will start after the current review.`, p.id)
  } else {
    p.state = 'reviewing'
    p.startedAt = Date.now()
    p.findings = undefined
    runScript(p)
  }
}

function runScript(p) {
  const script = p.script || genericScript(p)
  S.logs[p.id] = { lines: S.logs[p.id]?.lines?.length ? S.logs[p.id].lines : [], i: S.logs[p.id]?.lines?.length || 0 }
  if (PREFILL && !S.logs[p.id].i) { S.logs[p.id].lines = script.slice(0, PREFILL); S.logs[p.id].i = PREFILL }
  const tick = () => {
    const run = S.logs[p.id]
    if (p.state !== 'reviewing') return
    if (run.i >= script.length) return finish(p)
    run.lines.push(script[run.i++])
    const card = document.getElementById(`run-${p.id}`)
    if (card) card.outerHTML = runCard(p)
    if (S.inspector && S.selected === p.id && S.inspTab === 'log') renderInspector()
    run.timer = setTimeout(tick, 650 + Math.random() * 700)
  }
  tick()
}

function finish(p) {
  p.state = 'ready'
  p.findings = p.pendingFindings || genericFindings(p)
  p.event = verdictOf(p)
  p.run = { duration: clock(p.startedAt).replace(':', 'm ') + 's', iteration: (p.run?.iteration || 0) + 1, at: Date.now() }
  p.draft = p.findings.some((f) => f.sev === 'critical')
    ? `Thanks ${p.author} — this is close. One blocking issue around ${p.findings[0].title.toLowerCase()}; the rest are smaller notes inline.`
    : `Thanks ${p.author}! A couple of small notes inline, nothing blocking.`
  p.lens = p.lens || 'general'
  const crit = p.findings.filter((f) => f.sev === 'critical').length
  const maj = p.findings.filter((f) => f.sev === 'major').length
  notify(`${AGENTS[p.agent].label} finished #${p.num}`, `${p.findings.length} findings${crit ? ` · ${crit} critical` : ''}${maj ? ` · ${maj} major` : ''} — ready for you to send.`, p.id)
  const next = PRS.filter((x) => x.state === 'queued').sort((a, b) => a.queuePos - b.queuePos)[0]
  if (next) {
    PRS.filter((x) => x.state === 'queued').forEach((x) => { x.queuePos -= 1 })
    next.state = 'reviewing'; next.startedAt = Date.now(); runScript(next)
  }
  render()
}

function notify(title, body, prId) {
  const stack = document.getElementById('notifs')
  const n = document.createElement('div')
  n.className = 'notif'
  n.innerHTML = `<div class="app">${ordemMark(22)}</div><div><div class="h"><b>${esc(title)}</b><span>now</span></div><p>${esc(body)}</p></div>`
  n.onclick = () => { if (prId) { S.hero = false; S.selected = prId; const p = byId(prId); S.box = BOXES.find((b) => b.match(p))?.id || S.box; render() } dismiss() }
  const dismiss = () => { n.classList.add('out'); setTimeout(() => n.remove(), 300) }
  stack.prepend(n)
  setTimeout(dismiss, 6500)
}

/* ───────────────────────── Menus ───────────────────────── */
let menuState = null
function openMenu(anchor, sections, onPick, align = 'left') {
  closeMenu()
  const rect = anchor.getBoundingClientRect()
  const m = document.createElement('div')
  m.className = 'menu'
  m.innerHTML = sections.map((sec, si) => `${si ? '<div class="ms"></div>' : ''}${sec.title ? `<div class="mh">${sec.title}</div>` : ''}${sec.items.map((it) => `<button class="mi" data-key="${it.key}"><span class="tick">${it.on ? icon('check', 13, '', 2.2) : ''}</span>${it.icon || ''}<span>${it.label}${it.sub ? ` <span class="sub">${it.sub}</span>` : ''}</span>${it.k ? `<span class="k">${it.k}</span>` : ''}</button>`).join('')}`).join('')
  document.body.appendChild(m)
  const mh = m.offsetHeight
  const mw = m.offsetWidth
  const openUp = rect.bottom + mh + 8 > innerHeight
  m.style.top = `${openUp ? rect.top - mh - 6 : rect.bottom + 6}px`
  m.style.left = `${align === 'right' ? Math.max(8, rect.right - mw) : Math.min(rect.left, innerWidth - mw - 8)}px`
  m.style.setProperty('--origin', `${openUp ? 'bottom' : 'top'} ${align}`)
  m.addEventListener('click', (e) => {
    const b = e.target.closest('.mi'); if (!b) return
    e.stopPropagation(); closeMenu(); onPick(b.dataset.key)
  })
  menuState = m
}
function closeMenu() { menuState?.remove(); menuState = null }

/* ───────────────────────── Palette ───────────────────────── */
let pal = null
function openPalette() {
  closeMenu()
  const ov = document.getElementById('overlay')
  ov.innerHTML = `<div class="scrim" data-act="close-overlay"></div><div class="palette"><div class="q">${icon('search', 18)}<input id="pal-q" placeholder="Search pull requests, repos, or actions…" autocomplete="off"></div><div class="res" id="pal-res"></div><div class="foot"><span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div></div>`
  pal = { hl: 0, items: [] }
  const q = document.getElementById('pal-q')
  q.addEventListener('input', () => { pal.hl = 0; drawPalette(q.value) })
  q.focus()
  drawPalette('')
}
function paletteItems(query) {
  const qq = query.trim().toLowerCase()
  const prs = PRS.filter((p) => !qq || `${p.title} ${p.num} ${p.repo} ${p.author}`.toLowerCase().includes(qq.replace('#', ''))).slice(0, 7).map((p) => ({
    group: 'Pull requests', html: `<span class="ic" style="background:none">${glyph(p)}</span><span class="t">${esc(p.title)}</span><span class="s">${repoOf(p).name} #${p.num}</span>`, run: () => { S.hero = false; S.selected = p.id; S.box = BOXES.find((b) => b.match(p) && b.id !== 'mine')?.id || 'mine'; render() },
  }))
  const actions = [
    ['New review', 'compose', '⌘N', () => { S.hero = true; render(); document.getElementById('composer-input')?.focus() }],
    ['Sync with GitHub', 'refresh', '⌘R', doSync],
    ['Review everything requested from me', 'layers', '', reviewAllRequested],
    [`Switch to ${S.theme === 'dark' ? 'light' : 'dark'} appearance`, S.theme === 'dark' ? 'sun' : 'moon', '', () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; render() }],
    ['Toggle inspector', 'inspector', 'I', () => { S.inspector = !S.inspector; render() }],
    ['Settings…', 'gear', '⌘,', () => openSettings()],
    ...REPOS.map((r) => [`Go to ${r.slug}`, 'folder', '', () => { S.repo = r.slug; S.hero = false; render() }]),
  ].filter(([l]) => !qq || l.toLowerCase().includes(qq)).map(([l, ic, k, run]) => ({ group: 'Actions', html: `<span class="ic">${icon(ic, 13)}</span><span class="t">${l}</span>${k ? `<span class="s"><kbd>${k}</kbd></span>` : ''}`, run }))
  return [...prs, ...actions]
}
function drawPalette(query) {
  pal.items = paletteItems(query)
  let last = null
  document.getElementById('pal-res').innerHTML = pal.items.map((it, i) => {
    const head = it.group !== last ? `<div class="grp">${it.group}</div>` : ''
    last = it.group
    return `${head}<button class="it ${i === pal.hl ? 'hl' : ''}" data-pal="${i}">${it.html}</button>`
  }).join('') || '<div class="grp" style="padding:16px">No results</div>'
  document.querySelector('.it.hl')?.scrollIntoView({ block: 'nearest' })
}
function closeOverlay() { document.getElementById('overlay').innerHTML = ''; pal = null }

/* ───────────────────────── Settings ───────────────────────── */
let settingsTab = 'general'
function openSettings(tab) {
  closeMenu()
  if (tab) settingsTab = tab
  const tabs = [['general', 'General', 'gear'], ['agents', 'Agents', 'sparkles'], ['repos', 'Repositories', 'folder'], ['github', 'GitHub', 'github'], ['keys', 'Shortcuts', 'keyboard']]
  const sw = (key, on) => `<button class="switch ${on ? 'on' : ''}" data-act="set-toggle" data-id="${key}"></button>`
  const thumb = (dark) => `<div class="thumb"><div style="background:${dark ? '#2a2a31' : '#e9e9ee'}"></div><div style="background:${dark ? '#17171b' : '#fff'};display:grid;align-content:start;gap:3px;padding:6px"><i style="height:4px;border-radius:2px;background:${S.accent}"></i><i style="height:4px;width:70%;border-radius:2px;background:${dark ? '#444' : '#ddd'}"></i><i style="height:4px;width:50%;border-radius:2px;background:${dark ? '#444' : '#ddd'}"></i></div></div>`
  const content = {
    general: `
      <div class="group-label">Appearance</div>
      <div class="group">
        <div class="grow"><div class="l">Theme</div><div class="appearance">
          <button class="ap ${S.theme === 'light' ? 'on' : ''}" data-act="set-theme" data-id="light">${thumb(false)}Light</button>
          <button class="ap ${S.theme === 'dark' ? 'on' : ''}" data-act="set-theme" data-id="dark">${thumb(true)}Dark</button>
        </div></div>
        <div class="grow"><div class="l">Accent color</div><div class="accents">${['#ff7a3d', '#0a84ff', '#bf5af2', '#ff375f', '#30d158', '#ffd60a', '#98989d'].map((c) => `<button class="${S.accent === c ? 'on' : ''}" style="--c:${c}" data-act="set-accent" data-id="${c}"></button>`).join('')}</div></div>
      </div>
      <div class="group-label">Reviews</div>
      <div class="group">
        <div class="grow"><div class="l">Review new pull requests automatically<small>Queue a review as soon as a PR requests you</small></div>${sw('autoReview', S.autoReview)}</div>
        <div class="grow"><div class="l">Confirm before submitting to GitHub</div>${sw('confirmSubmit', S.confirmSubmit)}</div>
        <div class="grow"><div class="l">Notify me when a review finishes</div>${sw('notifyDone', S.notifyDone)}</div>
      </div>`,
    agents: `
      <div class="group-label">Installed agents</div>
      <div class="group">${Object.entries(AGENTS).map(([id, a]) => `<div class="grow agent-row"><div class="agent-badge">${agentIcon(id, 18)}</div><div class="l">${a.label}<small>${a.model}</small></div><span class="ok-pill ${a.ok ? '' : 'off'}">${a.ok ? 'Ready' : 'Not on PATH'}</span></div>`).join('')}</div>
      <div class="group-label">Defaults</div>
      <div class="group">
        <div class="grow"><div class="l">Default agent</div><button class="select-btn" data-act="menu-agent" data-scope="default">${agentIcon(S.defaultAgent, 14)}${AGENTS[S.defaultAgent].label}${icon('chevDown', 12)}</button></div>
        <div class="grow"><div class="l">Default depth</div><button class="select-btn" data-act="menu-depth" data-scope="default">${DEPTHS[S.defaultDepth].label}${icon('chevDown', 12)}</button></div>
      </div>`,
    repos: `
      <div class="group-label">Repositories folder</div>
      <div class="group"><div class="grow">${icon('folder')}<div class="l mono" style="font-size:12px">~/code</div><button class="btn">Choose…</button></div></div>
      <div class="group-label">Tracked repositories</div>
      <div class="group">${REPOS.map((r) => `<div class="grow"><span class="repo-dot" style="background:${r.color}"></span><div class="l">${r.slug}<small class="mono">~/code/${r.name} · main</small></div>${sw('repo-' + r.name, true)}</div>`).join('')}</div>`,
    github: `
      <div class="group-label">Account</div>
      <div class="group"><div class="grow">${avatar('izaias', 30)}<div class="l">izaias<small>Authenticated with gh · github.com</small></div><span class="ok-pill">Connected</span></div></div>
      <div class="group-label">Sync</div>
      <div class="group">
        <div class="grow"><div class="l">Only show PRs that request my review</div>${sw('onlyRequested', false)}</div>
        <div class="grow"><div class="l">Sync every<small>Ordem also syncs when the window becomes active</small></div><button class="select-btn">2 minutes${icon('chevDown', 12)}</button></div>
      </div>`,
    keys: `
      <div class="group">${[['Search everything', '⌘K'], ['New review', '⌘N'], ['Next / previous PR', 'J / K'], ['Start review', '⌘↵'], ['Include / exclude finding', 'X'], ['Submit review', '⌘↵'], ['Archive', 'E'], ['Toggle sidebar', '⌘\\'], ['Toggle inspector', 'I'], ['Sync', '⌘R']].map(([l, k]) => `<div class="grow"><div class="l">${l}</div><kbd style="font-size:12px">${k}</kbd></div>`).join('')}</div>`,
  }[settingsTab]
  document.getElementById('overlay').innerHTML = `<div class="scrim" data-act="close-overlay"></div>
    <div class="sheet">
      <div class="sheet-bar"><div class="lights"><i data-act="close-overlay"></i><i></i><i></i></div><div class="ttl">${tabs.find((t) => t[0] === settingsTab)[1]}</div>
        <div class="sheet-tabs">${tabs.map(([k, l, ic]) => `<button class="sheet-tab ${settingsTab === k ? 'on' : ''}" data-act="set-tab" data-id="${k}">${icon(ic, 20, '', 1.5)}${l}</button>`).join('')}</div></div>
      <div class="sheet-body">${content}</div>
    </div>`
}

/* ───────────────────────── Actions ───────────────────────── */
function doSync() {
  if (S.syncing) return
  S.syncing = true; renderSidebar()
  setTimeout(() => { S.syncing = false; S.syncedAt = Date.now(); renderSidebar() }, 1400)
}
function reviewAllRequested() {
  const list = PRS.filter((p) => p.state === 'needs_review' && p.requested && inRepo(p))
  list.forEach((p) => startReview(p))
  S.hero = false; S.box = 'reviewing'; S.selected = list[0]?.id ?? S.selected
  render()
}
function visibleIds() { return [...document.querySelectorAll('[data-row]')].map((n) => Number(n.dataset.row)) }
function move(delta) {
  const ids = visibleIds(); if (!ids.length) return
  const i = ids.indexOf(S.selected)
  const next = ids[Math.max(0, Math.min(ids.length - 1, i === -1 ? 0 : i + delta))]
  S.hero = false; S.selected = next; S.focusFinding = null
  renderList(); renderDetail(); renderInspector()
  document.querySelector(`[data-row="${next}"]`)?.scrollIntoView({ block: 'nearest' })
}
function advanceAfter(p) {
  const ids = visibleIds()
  const i = ids.indexOf(p.id)
  const nextId = ids[i + 1] ?? ids[i - 1]
  const row = document.querySelector(`[data-row="${p.id}"]`)
  const go = () => { S.selected = nextId && nextId !== p.id ? nextId : p.id; render() }
  if (row && !BOXES.find((b) => b.id === S.box).match(p)) { row.classList.add('leaving'); setTimeout(go, 260) } else go()
}
function submit(p) {
  const ev = p.event || verdictOf(p)
  const n = included(p).length
  p.submitted = { event: ev, at: Date.now() }
  p.findings.forEach((f) => { f.status = f.on ? 'pending' : 'dismissed' })
  p.findings = p.findings.filter((f) => f.status !== 'dismissed')
  if (ev === 'APPROVE') { p.state = 'settled'; p.settledHow = 'You approved' } else { p.state = 'waiting'; p.newCommits = 0 }
  notify('Review sent to GitHub', `${EVENTS[ev].label} on #${p.num} with ${n} inline comment${n === 1 ? '' : 's'}.`, p.id)
  advanceAfter(p)
}

document.addEventListener('click', (e) => {
  const palItem = e.target.closest('[data-pal]')
  if (palItem) { const it = pal.items[Number(palItem.dataset.pal)]; closeOverlay(); it.run(); return }
  if (menuState && !e.target.closest('.menu')) closeMenu()
  const el = e.target.closest('[data-act]'); if (!el) return
  const act = el.dataset.act
  const id = el.dataset.id
  const p = byId(S.selected)
  switch (act) {
    case 'box': S.box = id; S.hero = false; { const first = boxItems(id)[0]; const sec = sectionsFor(id, boxItems(id)).flatMap(([, l]) => l)[0]; S.selected = (sec || first)?.id ?? S.selected } render(); break
    case 'repo': S.repo = S.repo === id ? null : id; S.hero = false; render(); break
    case 'select': S.hero = false; S.selected = Number(id); S.focusFinding = null; { const sp = byId(S.selected); if (!BOXES.find((b) => b.id === S.box).match(sp)) S.box = BOXES.find((b) => b.match(sp))?.id || S.box } render(); break
    case 'toggle-sidebar': S.sidebar = !S.sidebar; render(); break
    case 'toggle-inspector': S.inspector = !S.inspector; render(); break
    case 'insp-tab': S.inspTab = id; renderInspector(); break
    case 'open-log': S.inspector = true; S.inspTab = 'log'; render(); break
    case 'palette': openPalette(); break
    case 'new': S.hero = true; render(); document.getElementById('composer-input')?.focus(); break
    case 'sync': doSync(); break
    case 'theme': S.theme = S.theme === 'dark' ? 'light' : 'dark'; render(); break
    case 'settings': openSettings(el.dataset.tab); break
    case 'close-overlay': closeOverlay(); break
    case 'set-tab': openSettings(id); break
    case 'set-theme': S.theme = id; render(); openSettings(); break
    case 'set-accent': S.accent = id; render(); openSettings(); break
    case 'set-toggle': if (id in S) S[id] = !S[id]; el.classList.toggle('on'); break
    case 'toggle-finding': { e.stopPropagation(); const f = p.findings.find((x) => x.id === Number(id)); f.on = !f.on; S.focusFinding = f.id; const y = document.getElementById('scroll').scrollTop; const draft = document.getElementById('composer-input')?.value; p.draft = draft ?? p.draft; renderDetail(); document.getElementById('scroll').style.scrollBehavior = 'auto'; document.getElementById('scroll').scrollTop = y; renderList(); break }
    case 'focus-finding': if (p.state === 'ready') { S.focusFinding = Number(id); document.querySelectorAll('.finding').forEach((n) => n.classList.toggle('focus', Number(n.dataset.id) === S.focusFinding)) } break
    case 'include-all': { const all = p.findings.every((f) => f.on); p.findings.forEach((f) => { f.on = !all }); p.draft = document.getElementById('composer-input')?.value ?? p.draft; renderDetail(); renderList(); break }
    case 'send': { const focus = document.getElementById('composer-input')?.value; startReview(p, focus); if (p.state === 'waiting') {} render(); break }
    case 'send-hero': { const v = document.getElementById('composer-input').value; const m = v.match(/pull\/(\d+)/); const t = m && PRS.find((x) => x.num === Number(m[1])); if (t) { S.hero = false; S.selected = t.id; startReview(t); S.box = 'reviewing'; render() } else { reviewAllRequested() } break }
    case 'suggest-requested': reviewAllRequested(); break
    case 'retry': startReview(p, ''); render(); break
    case 'stop': clearTimeout(S.logs[p.id]?.timer); delete S.logs[p.id]; p.state = 'needs_review'; render(); break
    case 'dequeue': p.state = 'needs_review'; render(); break
    case 'submit': {
      p.draft = document.getElementById('composer-input')?.value ?? p.draft
      submit(p); break
    }
    case 'menu-agent': {
      const scoped = el.dataset.scope === 'default'
      const current = scoped || S.hero ? S.defaultAgent : (p.agent || S.defaultAgent)
      openMenu(el, [{ title: 'Agent', items: Object.entries(AGENTS).map(([k, a]) => ({ key: k, on: current === k, icon: agentIcon(k, 14), label: a.label, sub: a.ok ? a.model : 'not installed' })) }], (k) => {
        if (scoped || S.hero) S.defaultAgent = k; else p.agent = k
        if (scoped) openSettings(); else { const v = document.getElementById('composer-input')?.value; if (p && !S.hero) p.focus = v; renderDetail() }
      })
      break
    }
    case 'menu-depth': {
      const scoped = el.dataset.scope === 'default'
      const current = scoped || S.hero ? S.defaultDepth : (p.depth || S.defaultDepth)
      openMenu(el, [{ title: 'Depth', items: Object.entries(DEPTHS).map(([k, d]) => ({ key: k, on: current === k, icon: icon(d.icon, 14), label: d.label, sub: d.sub })) }], (k) => {
        if (scoped || S.hero) S.defaultDepth = k; else p.depth = k
        if (scoped) openSettings(); else { const v = document.getElementById('composer-input')?.value; if (p && !S.hero) p.focus = v; renderDetail() }
      })
      break
    }
    case 'menu-lens': {
      openMenu(el, [{ title: 'Focus', items: Object.entries(LENSES).map(([k, l]) => ({ key: k, on: (p.lens || 'general') === k, icon: icon(l.icon, 14), label: l.label })) }, { items: [{ key: 'new', icon: icon('plus', 14), label: 'New preset…' }] }], (k) => {
        if (k !== 'new') { p.lens = k; p.focus = document.getElementById('composer-input')?.value; renderDetail() }
      })
      break
    }
    case 'menu-event': {
      openMenu(el, [{ title: 'Submit as', items: Object.entries(EVENTS).map(([k, ev]) => ({ key: k, on: (p.event || verdictOf(p)) === k, icon: `<span class="swatch" style="width:8px;height:8px;border-radius:50%;background:${ev.color}"></span>`, label: ev.label, sub: k === verdictOf(p) ? 'suggested' : '' })) }], (k) => {
        p.event = k; p.draft = document.getElementById('composer-input')?.value ?? p.draft; renderDetail()
      })
      break
    }
    case 'filter-menu': {
      openMenu(el, [
        { title: 'Show', items: [{ key: 'req', on: false, label: 'Only requested from me' }, { key: 'mine', on: true, label: 'Include my pull requests' }, { key: 'drafts', on: false, label: 'Include drafts' }] },
        { title: 'Sort by', items: [{ key: 'wait', on: true, label: 'Longest waiting' }, { key: 'new', label: 'Newest' }, { key: 'small', label: 'Smallest diff' }, { key: 'act', label: 'Recent activity' }] },
      ], () => {}, 'right')
      break
    }
    case 'pr-menu': {
      openMenu(el, [{ items: [{ key: 'gh', icon: icon('github', 14), label: 'Open on GitHub', k: '⌘O' }, { key: 'copy', icon: icon('link', 14), label: 'Copy link', k: '⇧⌘C' }] }, { items: [{ key: 'rerun', icon: icon('refresh', 14), label: 'Run another review…' }, { key: 'archive', icon: icon('archive', 14), label: 'Archive', k: 'E' }] }], (k) => {
        if (k === 'archive') { p.state = 'settled'; p.settledHow = 'Archived'; advanceAfter(p) }
      }, 'right')
      break
    }
  }
})

document.addEventListener('input', (e) => { if (e.target.id === 'composer-input') autosize() })

document.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey
  const typing = ['TEXTAREA', 'INPUT'].includes(document.activeElement?.tagName)
  if (pal) {
    if (e.key === 'Escape') { closeOverlay(); return }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); pal.hl = Math.max(0, Math.min(pal.items.length - 1, pal.hl + (e.key === 'ArrowDown' ? 1 : -1))); drawPalette(document.getElementById('pal-q').value); return }
    if (e.key === 'Enter') { e.preventDefault(); const it = pal.items[pal.hl]; closeOverlay(); it?.run(); return }
    return
  }
  if (e.key === 'Escape') { closeMenu(); closeOverlay(); if (typing) document.activeElement.blur(); return }
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return }
  if (mod && e.key === '\\') { e.preventDefault(); S.sidebar = !S.sidebar; render(); return }
  if (mod && e.key === ',') { e.preventDefault(); openSettings(); return }
  if (mod && e.key.toLowerCase() === 'r') { e.preventDefault(); doSync(); return }
  if (mod && e.key === 'Enter') {
    e.preventDefault()
    if (S.hero) { document.querySelector('[data-act="send-hero"]')?.click(); return }
    const btn = document.querySelector('[data-act="submit"]') || document.querySelector('.composer [data-act="send"]')
    btn?.click(); return
  }
  if (typing || mod) return
  const p = byId(S.selected)
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); move(1) }
  if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); move(-1) }
  if (e.key === 'i') { S.inspector = !S.inspector; render() }
  if (e.key === 'x' && p?.state === 'ready') {
    const fid = S.focusFinding ?? included(p)[0]?.id ?? p.findings[0].id
    document.querySelector(`[data-act="toggle-finding"][data-id="${fid}"]`)?.click()
  }
  if (e.key === 'e' && p) { p.state = 'settled'; p.settledHow = 'Archived'; advanceAfter(p) }
  if (e.key === 'r' && p) { e.preventDefault(); document.getElementById('composer-input')?.focus() }
})

/* live clocks + relative times */
setInterval(() => {
  document.querySelectorAll('[data-clock]').forEach((n) => { n.textContent = clock(Number(n.dataset.clock)) })
}, 1000)
setInterval(() => { if (!S.syncing) renderSidebar() }, 30e3)

if (Q.get('pr')) {
  const target = PRS.find((p) => p.num === Number(Q.get('pr')))
  if (target) S.selected = target.id
}
if (Q.get('start')) { const t = PRS.find((p) => p.num === Number(Q.get('start'))); if (t) { t.agent = 'claude'; t.depth = 'standard'; startReview(t) } }
render()
if (!Q.has('nosim')) runScript(byId(2))
if (Q.has('palette')) { openPalette(); const q = document.getElementById('pal-q'); q.value = Q.get('palette'); q.dispatchEvent(new Event('input')) }
if (Q.get('settings')) openSettings(Q.get('settings'))
if (Q.get('menu')) document.querySelector(`[data-act="menu-${Q.get('menu')}"]`)?.click()
if (Q.get('notify')) { const t = PRS.find((p) => p.num === Number(Q.get('notify'))); notify(`Claude finished #${t.num}`, '3 findings · 1 critical · 1 major — ready for you to send.', t.id) }
</script>
</body>
</html>
