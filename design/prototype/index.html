<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordem — redesign prototype</title>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --accent: #ff7a3d;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.36, .64, 1);
}

html[data-theme="dark"] {
  color-scheme: dark;
  --wall:
    radial-gradient(1100px 700px at 12% 8%, #3b2c63 0%, transparent 60%),
    radial-gradient(900px 700px at 92% 95%, #6a2c1b 0%, transparent 55%),
    radial-gradient(700px 500px at 60% 40%, #1f2a4a 0%, transparent 60%),
    linear-gradient(160deg, #13131d, #1b1420 60%, #110e13);
  --sidebar: rgba(34, 34, 40, .55);
  --list: #1c1c21;
  --content: #17171b;
  --elev: #212127;
  --elev2: #2a2a31;
  --field: rgba(255, 255, 255, .06);
  --hover: rgba(255, 255, 255, .05);
  --press: rgba(255, 255, 255, .09);
  --sel-side: rgba(255, 255, 255, .10);
  --sel-list: color-mix(in oklab, var(--accent) 22%, transparent);
  --hair: rgba(255, 255, 255, .07);
  --hair2: rgba(255, 255, 255, .13);
  --t1: rgba(255, 255, 255, .93);
  --t2: rgba(235, 235, 245, .62);
  --t3: rgba(235, 235, 245, .40);
  --t4: rgba(235, 235, 245, .20);
  --red: #ff453a; --orange: #ff9f0a; --yellow: #ffd60a; --green: #30d158;
  --blue: #0a84ff; --purple: #bf5af2; --teal: #64d2ff; --gray: #98989d;
  --accent-text: color-mix(in oklab, var(--accent) 80%, white);
  --shadow-win: inset 0 0 0 .5px rgba(255, 255, 255, .14), 0 0 0 1px rgba(0, 0, 0, .55), 0 30px 90px rgba(0, 0, 0, .55), 0 10px 30px rgba(0, 0, 0, .35);
  --shadow-pop: inset 0 0 0 .5px rgba(255, 255, 255, .12), 0 0 0 .5px rgba(0, 0, 0, .8), 0 16px 48px rgba(0, 0, 0, .5);
  --shadow-card: 0 0 0 .5px var(--hair2);
  --glass: rgba(38, 38, 44, .72);
}

html[data-theme="light"] {
  color-scheme: light;
  --wall:
    radial-gradient(1100px 700px at 12% 8%, #c9c1f2 0%, transparent 60%),
    radial-gradient(900px 700px at 92% 95%, #ffc9a8 0%, transparent 55%),
    radial-gradient(700px 500px at 60% 40%, #bfd6ff 0%, transparent 60%),
    linear-gradient(160deg, #eef0f7, #f6efef 60%, #efeaf3);
  --sidebar: rgba(236, 236, 241, .62);
  --list: #fafafb;
  --content: #ffffff;
  --elev: #ffffff;
  --elev2: #f3f3f5;
  --field: rgba(0, 0, 0, .05);
  --hover: rgba(0, 0, 0, .04);
  --press: rgba(0, 0, 0, .07);
  --sel-side: rgba(0, 0, 0, .075);
  --sel-list: color-mix(in oklab, var(--accent) 16%, transparent);
  --hair: rgba(0, 0, 0, .07);
  --hair2: rgba(0, 0, 0, .12);
  --t1: rgba(0, 0, 0, .87);
  --t2: rgba(60, 60, 67, .68);
  --t3: rgba(60, 60, 67, .46);
  --t4: rgba(60, 60, 67, .24);
  --red: #ff3b30; --orange: #ff9500; --yellow: #f5b800; --green: #28b84a;
  --blue: #007aff; --purple: #af52de; --teal: #30b0d7; --gray: #8e8e93;
  --accent-text: color-mix(in oklab, var(--accent) 82%, black);
  --shadow-win: 0 0 0 .5px rgba(0, 0, 0, .22), 0 30px 90px rgba(40, 30, 60, .25), 0 10px 30px rgba(0, 0, 0, .10);
  --shadow-pop: 0 0 0 .5px rgba(0, 0, 0, .14), 0 16px 48px rgba(0, 0, 0, .18);
  --shadow-card: 0 0 0 .5px var(--hair2), 0 1px 2px rgba(0, 0, 0, .04);
  --glass: rgba(250, 250, 252, .78);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font: 13px/1.45 var(--font);
  color: var(--t1);
  background: var(--wall);
  background-color: #111;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  letter-spacing: -.003em;
  user-select: none;
  cursor: default;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: default; }
code, .mono { font-family: var(--mono); font-size: .92em; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--t4); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

.i { flex-shrink: 0; display: block; }

/* ── Window ─────────────────────────────── */
.desktop { position: fixed; inset: 0; padding: 26px; display: flex; }
body.bare .desktop { padding: 0; }
body.bare .window { border-radius: 0; }
.window {
  flex: 1;
  display: grid;
  grid-template-columns: var(--sb) var(--lw) minmax(0, 1fr) var(--iw);
  grid-template-rows: minmax(0, 1fr);
  min-height: 0;
  --sb: 236px; --lw: 344px; --iw: 0px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow-win);
  position: relative;
  transition: grid-template-columns .32s var(--ease);
}
.window.no-sidebar { --sb: 0px; }
.window.with-inspector { --iw: 312px; }

/* ── Sidebar ────────────────────────────── */
.sidebar {
  background: var(--sidebar);
  backdrop-filter: blur(60px) saturate(190%);
  -webkit-backdrop-filter: blur(60px) saturate(190%);
  display: flex; flex-direction: column; min-width: 0; overflow: hidden;
  border-right: .5px solid var(--hair);
}
.titlebar { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 18px; flex-shrink: 0; }
.lights { display: flex; gap: 8px; margin-right: auto; }
.lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .25); }
.lights i:nth-child(1) { background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }
.floating-lights { position: absolute; top: 20px; left: 18px; z-index: 5; opacity: 0; pointer-events: none; transition: opacity .2s; }
.window.no-sidebar .floating-lights { opacity: 1; }
.window.no-sidebar .list .toolbar { padding-left: 84px; }

.tb-btn {
  height: 28px; min-width: 28px; padding: 0 7px; border-radius: 7px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  color: var(--t2); transition: background .12s, color .12s; white-space: nowrap;
}
.tb-btn:hover { background: var(--hover); color: var(--t1); }
.tb-btn:active { background: var(--press); }
.tb-btn.on { color: var(--accent); }

.sb-scroll { flex: 1; overflow: auto; padding: 2px 10px 10px; }
.sb-search {
  display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 8px; border-radius: 7px;
  background: var(--field); color: var(--t3); margin-bottom: 12px; width: 100%;
}
.sb-search:hover { color: var(--t2); }
.sb-search kbd { margin-left: auto; }
kbd { font: 500 11px var(--font); color: var(--t3); letter-spacing: .02em; }
.sb-item {
  display: flex; align-items: center; gap: 9px; height: 28px; padding: 0 8px; border-radius: 6px;
  width: 100%; text-align: left; color: var(--t1); transition: background .1s;
}
.sb-item:hover { background: var(--hover); }
.sb-item.on { background: var(--sel-side); }
.sb-item .i { color: var(--accent); }
.sb-item.dim { color: var(--t2); }
.sb-item.dim .i { color: var(--t3); }
.sb-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-item .count { color: var(--t3); font-size: 12px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
.sb-item .count.hot { color: var(--t1); font-weight: 600; }
.sb-head { font-size: 11px; font-weight: 600; color: var(--t3); padding: 16px 8px 5px; display: flex; align-items: center; justify-content: space-between; }
.sb-head button { color: var(--t3); border-radius: 5px; padding: 2px; }
.sb-head button:hover { color: var(--t1); background: var(--hover); }
.repo-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; margin: 0 3.5px; }
.repo-dot.sm { width: 7px; height: 7px; border-radius: 2px; margin: 0; }
.sb-foot { border-top: .5px solid var(--hair); padding: 8px 10px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.sync-chip { display: flex; align-items: center; gap: 6px; color: var(--t3); font-size: 11.5px; border-radius: 6px; padding: 4px 6px; margin-right: auto; min-width: 0; white-space: nowrap; }
.sync-chip:hover { background: var(--hover); color: var(--t2); }
.sync-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px color-mix(in oklab, var(--green) 20%, transparent); }

/* ── List ───────────────────────────────── */
.list { background: var(--list); display: flex; flex-direction: column; min-width: 0; border-right: .5px solid var(--hair); }
.toolbar { height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 10px 0 16px; flex-shrink: 0; border-bottom: .5px solid var(--hair); transition: padding .3s var(--ease); }
.list .toolbar .ttl { flex: 1; min-width: 0; }
.list .toolbar h2 { font-size: 14px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
.list .toolbar .sub { font-size: 11px; color: var(--t3); line-height: 1.2; margin-top: 1px; }
.rows { flex: 1; overflow: auto; padding: 4px 8px 16px; }
.section-label { font-size: 11px; font-weight: 600; color: var(--t3); padding: 12px 10px 4px; display: flex; align-items: center; gap: 6px; }
.section-label .n { font-weight: 500; color: var(--t4); }
.row {
  display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; column-gap: 10px; row-gap: 1px;
  padding: 9px 10px 10px; border-radius: 9px; position: relative; width: 100%; text-align: left;
  transition: background .1s;
}
.row:hover { background: var(--hover); }
.row.on { background: var(--sel-list); }
.row .glyph { grid-row: 1 / 3; padding-top: 1px; }
.row .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .age { font-size: 11.5px; color: var(--t3); text-align: right; font-variant-numeric: tabular-nums; }
.row .age.stale { color: var(--orange); }
.row .age.rotten { color: var(--red); }
.row .meta { font-size: 12px; color: var(--t2); display: flex; gap: 6px; align-items: center; overflow: hidden; white-space: nowrap; min-width: 0; }
.row .meta .who { overflow: hidden; text-overflow: ellipsis; }
.row .tag { justify-self: end; align-self: center; }
.row.leaving { animation: leave .35s var(--ease) forwards; }
@keyframes leave { to { opacity: 0; transform: translateX(-16px); } }

.chip {
  display: inline-flex; align-items: center; gap: 4px; height: 19px; padding: 0 7px; border-radius: 6px;
  font-size: 11px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums;
  color: var(--c, var(--t2)); background: color-mix(in oklab, var(--c, var(--t3)) 15%, transparent);
}
.chip.ghost { background: none; padding: 0; font-weight: 500; }
.diffstat { font: 500 11.5px var(--mono); display: inline-flex; gap: 5px; }
.diffstat .a { color: var(--green); }
.diffstat .d { color: var(--red); }

.list-empty { height: 70%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--t3); text-align: center; padding: 20px; }
.list-empty .big { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: color-mix(in oklab, var(--green) 14%, transparent); color: var(--green); }
.list-empty b { color: var(--t1); font-size: 14px; }

/* ── Detail ─────────────────────────────── */
.detail { background: var(--content); display: flex; flex-direction: column; min-width: 0; position: relative; }
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--t2); min-width: 0; flex: 1; font-size: 13px; }
.crumbs b { color: var(--t1); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs .i { color: var(--t4); }
.scroll { flex: 1; overflow: auto; scroll-behavior: smooth; }
.page { max-width: 760px; margin: 0 auto; padding: 30px 44px 240px; }
.page > * { animation: rise .4s var(--ease) both; animation-delay: calc(var(--d, 0) * 40ms); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

.kicker { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--t2); margin-bottom: 10px; }
.kicker .state { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--c, var(--t2)); }
h1.pr-title { font-size: 23px; line-height: 1.22; font-weight: 700; letter-spacing: -.022em; user-select: text; }
.byline { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--t2); flex-wrap: wrap; row-gap: 4px; }
.byline b { color: var(--t1); font-weight: 600; }
.ref { font: 12px var(--mono); padding: 1px 6px; border-radius: 5px; background: var(--field); color: var(--t1); }
.stats { display: flex; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
.stat { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 8px; background: var(--field); color: var(--t2); font-size: 12px; }
.stat .i { color: var(--c, var(--t3)); }

.block { margin-top: 28px; }
.block-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.block-head h3 { font-size: 13px; font-weight: 700; letter-spacing: -.005em; }
.block-head .aside { margin-left: auto; color: var(--t3); font-size: 12px; display: flex; align-items: center; gap: 10px; }
.link { color: var(--accent-text); font-weight: 500; border-radius: 5px; }
.link:hover { text-decoration: underline; text-underline-offset: 2px; }

.card { background: var(--elev); border-radius: 14px; box-shadow: var(--shadow-card); padding: 16px 18px; }
.brief { display: grid; grid-template-columns: 1fr; gap: 14px; }
.brief ul { list-style: none; display: grid; gap: 7px; }
.brief li { display: grid; grid-template-columns: 14px 1fr; gap: 8px; color: var(--t1); line-height: 1.5; user-select: text; }
.brief li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--t4); margin: 7px 0 0 4px; }
.brief code { background: var(--field); padding: 0 4px; border-radius: 4px; }
.risks { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-top: 12px; border-top: .5px solid var(--hair); }
.risks .lbl { font-size: 11.5px; color: var(--t3); margin-right: 2px; }
.ai-mark { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--t3); }
.ai-mark .i { color: var(--accent); }

.verdict { display: grid; grid-template-columns: 36px 1fr auto; gap: 14px; align-items: center; }
.agent-badge { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--field); }
.verdict .what { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.verdict .what em { font-style: normal; color: var(--c); }
.verdict .why { color: var(--t2); margin-top: 2px; user-select: text; }
.verdict .meta { color: var(--t3); font-size: 11.5px; margin-top: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.sev-summary { display: flex; gap: 5px; margin-top: 12px; padding-top: 12px; border-top: .5px solid var(--hair); }

.finding-group { font-size: 11px; font-weight: 600; color: var(--t3); margin: 18px 2px 8px; display: flex; align-items: center; gap: 6px; }
.finding {
  display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px; padding: 14px 16px 14px 14px; border-radius: 13px;
  background: var(--elev); box-shadow: var(--shadow-card); margin-bottom: 8px; transition: opacity .2s, box-shadow .15s, transform .15s;
}
.finding.off { opacity: .48; }
.finding.focus { box-shadow: 0 0 0 1.5px var(--accent), 0 6px 24px color-mix(in oklab, var(--accent) 12%, transparent); }
.finding .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.finding .f-title { font-weight: 600; font-size: 13.5px; letter-spacing: -.005em; }
.finding .f-loc { font: 11.5px var(--mono); color: var(--t3); margin-left: auto; }
.finding .f-body { color: var(--t2); margin-top: 5px; line-height: 1.55; user-select: text; }
.finding .f-body code { color: var(--t1); background: var(--field); padding: 0 4px; border-radius: 4px; }
.finding .f-actions { display: flex; gap: 2px; margin-top: 8px; margin-left: -7px; }
.finding .f-actions .tb-btn { height: 24px; font-size: 12px; }
.finding .status-chip { margin-left: auto; }
.finding.addressed .f-title { text-decoration: line-through; text-decoration-color: var(--t4); color: var(--t2); }

.check {
  width: 18px; height: 18px; border-radius: 5px; margin-top: 1px; display: grid; place-items: center;
  box-shadow: inset 0 0 0 1px var(--hair2); background: var(--field); transition: background .12s, box-shadow .12s;
}
.check.on { background: var(--accent); box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .15), 0 1px 2px rgba(0, 0, 0, .2); color: #fff; }
.check .i { opacity: 0; transform: scale(.6); transition: .15s var(--spring); }
.check.on .i { opacity: 1; transform: none; }

.diff { font: 12px/1.65 var(--mono); border-radius: 9px; overflow: hidden; background: var(--content); box-shadow: 0 0 0 .5px var(--hair2); margin-top: 10px; user-select: text; }
.diff .hd { padding: 5px 12px; font-size: 11px; color: var(--t3); border-bottom: .5px solid var(--hair); display: flex; gap: 8px; font-family: var(--font); }
.diff .l { padding: 0 12px; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.diff .l::before { display: inline-block; width: 14px; color: var(--t4); content: " "; }
.diff .add { background: color-mix(in oklab, var(--green) 12%, transparent); }
.diff .add::before { content: "+"; color: var(--green); }
.diff .del { background: color-mix(in oklab, var(--red) 11%, transparent); }
.diff .del::before { content: "−"; color: var(--red); }

/* Agent run */
.run { padding: 0; overflow: hidden; }
.run-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
.run-head .what { font-weight: 600; font-size: 14px; }
.run-head .sub { color: var(--t3); font-size: 12px; margin-top: 1px; }
.run-head .clock { margin-left: auto; font: 500 13px var(--mono); color: var(--t2); font-variant-numeric: tabular-nums; }
.steps { padding: 2px 16px 12px 16px; display: grid; gap: 7px; }
.step { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: center; color: var(--t3); }
.step.done { color: var(--t2); }
.step.now { color: var(--t1); font-weight: 500; }
.step .d { width: 18px; height: 18px; display: grid; place-items: center; }
.log { border-top: .5px solid var(--hair); background: color-mix(in oklab, var(--content) 60%, transparent); padding: 10px 16px 12px; font: 11.5px/1.7 var(--mono); color: var(--t3); height: 132px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; -webkit-mask-image: linear-gradient(transparent, #000 40%); mask-image: linear-gradient(transparent, #000 40%); }
.log .ln { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: lnIn .3s var(--ease); }
.log .ln.status { color: var(--t1); }
.log .ln.ok { color: var(--green); }
.log .ln.err { color: var(--red); }
@keyframes lnIn { from { opacity: 0; transform: translateY(4px); } }
.shimmer {
  background: linear-gradient(90deg, var(--t3) 0%, var(--t3) 35%, var(--t1) 50%, var(--t3) 65%, var(--t3) 100%);
  background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 2.2s linear infinite;
}
@keyframes shimmer { from { background-position: 125% 0; } to { background-position: -125% 0; } }
.spin { animation: spin .9s linear infinite; transform-origin: 50% 50%; }
@keyframes spin { to { transform: rotate(360deg); } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

.callout { display: grid; grid-template-columns: 36px 1fr auto; gap: 14px; align-items: center; }
.callout .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--c); background: color-mix(in oklab, var(--c) 15%, transparent); }
.callout .what { font-weight: 600; font-size: 14px; }
.callout .why { color: var(--t2); margin-top: 2px; user-select: text; }

.btn {
  height: 30px; padding: 0 13px; border-radius: 8px; display: inline-flex; align-items: center; gap: 7px; font-weight: 500;
  background: var(--elev2); box-shadow: 0 0 0 .5px var(--hair2), 0 1px 1px rgba(0, 0, 0, .08); white-space: nowrap;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { filter: brightness(.95); transform: translateY(.5px); }
.btn.primary { background: var(--accent); color: #fff; box-shadow: inset 0 .5px 0 rgba(255, 255, 255, .25), 0 1px 2px rgba(0, 0, 0, .25); }

/* Composer */
.composer-wrap { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 32px 20px; pointer-events: none; background: linear-gradient(transparent, var(--content) 46%); }
.composer {
  pointer-events: auto; max-width: 720px; margin: 0 auto; background: var(--elev); border-radius: 20px;
  box-shadow: 0 0 0 .5px var(--hair2), 0 10px 40px rgba(0, 0, 0, .22), 0 2px 6px rgba(0, 0, 0, .08);
  padding: 13px 10px 9px 16px; transition: box-shadow .2s; container-type: inline-size;
}
.composer:focus-within { box-shadow: 0 0 0 .5px var(--hair2), 0 0 0 4px color-mix(in oklab, var(--accent) 16%, transparent), 0 10px 40px rgba(0, 0, 0, .22); }
.composer textarea {
  width: 100%; background: none; border: 0; outline: 0; resize: none; color: var(--t1);
  font: 14px/1.5 var(--font); min-height: 44px; max-height: 160px; padding-right: 6px; user-select: text;
}
.composer textarea::placeholder { color: var(--t3); }
.composer textarea:disabled { opacity: .9; }
.composer .bar { display: flex; align-items: center; gap: 2px; margin-top: 4px; margin-left: -6px; min-width: 0; }
.composer .bar > .send, .composer .bar > .vsep { flex-shrink: 0; }
.composer .bar .pill { min-width: 0; overflow: hidden; }
@container (max-width: 660px) { .composer .opt { display: none; } }
@container (max-width: 560px) { .composer .opt2 { display: none; } .send.wide kbd { display: none; } }
.pill { height: 28px; padding: 0 9px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; color: var(--t2); font-size: 12.5px; white-space: nowrap; transition: background .1s, color .1s; }
.pill:hover { background: var(--hover); color: var(--t1); }
.pill .i.chev { opacity: .5; }
.pill .swatch { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in oklab, var(--c) 22%, transparent); }
.vsep { width: 1px; height: 14px; background: var(--hair2); margin: 0 3px; }
.send {
  margin-left: auto; height: 32px; min-width: 32px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--accent); color: #fff; font-weight: 600; box-shadow: inset 0 .5px 0 rgba(255, 255, 255, .3), 0 2px 8px color-mix(in oklab, var(--accent) 40%, transparent);
  transition: transform .12s var(--spring), filter .12s;
}
.send.wide { padding: 0 8px 0 14px; }
.send.wide kbd { color: rgba(255, 255, 255, .75); background: rgba(255, 255, 255, .16); padding: 1px 5px; border-radius: 5px; }
.send:hover { filter: brightness(1.08); }
.send:active { transform: scale(.96); }
.send.stop { background: var(--elev2); color: var(--t1); box-shadow: 0 0 0 .5px var(--hair2); }
.send:disabled { opacity: .45; }
.composer-hint { max-width: 720px; margin: 8px auto 0; display: flex; justify-content: center; gap: 14px; color: var(--t3); font-size: 11px; pointer-events: auto; }
.composer-hint span { display: inline-flex; align-items: center; gap: 4px; }

/* Hero */
.hero { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 48px 80px; }
.hero .mark {
  width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; margin-bottom: 22px;
  background: #0e0e0e; color: #f5f5f5;
  box-shadow: inset 0 0 0 .5px var(--hair2), 0 12px 30px rgba(0, 0, 0, .35);
}
.hero h2 { font-size: 26px; font-weight: 600; letter-spacing: -.025em; text-align: center; }
.hero h2 u { text-decoration: underline dotted var(--t3); text-underline-offset: 5px; text-decoration-thickness: 1.5px; }
.hero p { color: var(--t3); margin-top: 6px; text-align: center; }
.hero .composer { width: 100%; max-width: 680px; margin-top: 28px; }
.suggestions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; justify-content: center; max-width: 720px; }
.suggestion { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 11px; background: var(--field); color: var(--t2); font-size: 12.5px; transition: background .12s, color .12s, transform .12s; }
.suggestion:hover { background: var(--press); color: var(--t1); transform: translateY(-1px); }
.suggestion .i { color: var(--accent); }

/* Inspector */
.inspector { background: var(--list); border-left: .5px solid var(--hair); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.inspector .toolbar { padding: 0 12px; }
.seg { display: flex; padding: 2px; border-radius: 8px; background: var(--field); gap: 2px; width: 100%; }
.seg button { flex: 1; height: 24px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--t2); white-space: nowrap; }
.seg button.on { background: var(--elev2); color: var(--t1); box-shadow: 0 0 0 .5px var(--hair2), 0 1px 3px rgba(0, 0, 0, .18); }
html[data-theme="light"] .seg button.on { background: #fff; }
.insp-body { flex: 1; overflow: auto; padding: 14px 14px 30px; min-width: 312px; }
.tl { display: grid; gap: 0; }
.tl-item { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding-bottom: 16px; position: relative; }
.tl-item::before { content: ""; position: absolute; left: 10.5px; top: 22px; bottom: 2px; width: 1px; background: var(--hair2); }
.tl-item:last-child::before { display: none; }
.tl-dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--field); color: var(--c, var(--t2)); }
.tl-item .what { font-size: 12.5px; color: var(--t1); line-height: 1.4; padding-top: 2px; }
.tl-item .when { font-size: 11.5px; color: var(--t3); margin-top: 1px; }
.file-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 7px; font-size: 12px; }
.file-row:hover { background: var(--hover); }
.file-row .p { font-family: var(--mono); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.file-row .i { color: var(--t3); }
.bars { display: inline-flex; gap: 1.5px; margin-left: 6px; vertical-align: middle; }
.bars i { width: 6px; height: 6px; border-radius: 1.5px; background: var(--t4); }
.bars i.a { background: var(--green); }
.bars i.d { background: var(--red); }
.file-line { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 8px; }
.file-line:hover { background: var(--hover); }
.file-line .i { color: var(--t3); }
.file-line .fp { display: flex; gap: 8px; align-items: baseline; min-width: 0; white-space: nowrap; overflow: hidden; }
.file-line .fp b { font: 500 12.5px var(--mono); color: var(--t1); }
.file-line .fp span { font: 11.5px var(--mono); color: var(--t3); overflow: hidden; text-overflow: ellipsis; }
.file-line .bars { margin-left: 0; }
.full-log { font: 11.5px/1.75 var(--mono); color: var(--t3); user-select: text; }
.full-log .ln.status { color: var(--t1); }
.full-log .ln.ok { color: var(--green); }
.full-log .ln.err { color: var(--red); }
.full-log .ln { white-space: pre-wrap; word-break: break-all; }

/* Menus / popovers */
.menu {
  position: fixed; z-index: 60; min-width: 220px; padding: 5px; border-radius: 11px; background: var(--glass);
  backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
  box-shadow: var(--shadow-pop); animation: pop .14s var(--ease); transform-origin: var(--origin, top left);
}
@keyframes pop { from { opacity: 0; transform: scale(.96); } }
.menu .mi { display: flex; align-items: center; gap: 9px; width: 100%; height: 26px; padding: 0 9px 0 7px; border-radius: 6px; text-align: left; color: var(--t1); white-space: nowrap; }
.menu .mi .tick { width: 14px; color: var(--t1); }
.menu .mi .k { margin-left: auto; padding-left: 16px; color: var(--t3); font-size: 12px; }
.menu .mi .sub { color: var(--t3); font-size: 11.5px; }
.menu .mi:hover, .menu .mi.hl { background: var(--accent); color: #fff; }
.menu .mi:hover .k, .menu .mi:hover .sub, .menu .mi:hover .tick { color: rgba(255, 255, 255, .8); }
.menu .ms { height: 1px; background: var(--hair2); margin: 5px 8px; }
.menu .mh { font-size: 11px; font-weight: 600; color: var(--t3); padding: 6px 9px 3px; }

/* Palette */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .18); animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.palette {
  position: fixed; z-index: 55; top: 15%; left: 50%; transform: translateX(-50%); width: min(640px, 90vw);
  background: var(--glass); backdrop-filter: blur(50px) saturate(190%); -webkit-backdrop-filter: blur(50px) saturate(190%);
  border-radius: 16px; box-shadow: var(--shadow-pop), 0 40px 100px rgba(0, 0, 0, .35); overflow: hidden; animation: palIn .18s var(--ease);
}
@keyframes palIn { from { opacity: 0; transform: translateX(-50%) scale(.97) translateY(-6px); } }
.palette .q { display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 56px; border-bottom: .5px solid var(--hair2); }
.palette .q .i { color: var(--t3); }
.palette input { flex: 1; background: none; border: 0; outline: 0; font: 400 19px var(--font); color: var(--t1); letter-spacing: -.01em; }
.palette input::placeholder { color: var(--t3); }
.palette .res { max-height: 380px; overflow: auto; padding: 6px; }
.palette .grp { font-size: 11px; font-weight: 600; color: var(--t3); padding: 8px 12px 4px; }
.palette .it { display: flex; align-items: center; gap: 11px; width: 100%; height: 38px; padding: 0 12px; border-radius: 9px; text-align: left; }
.palette .it .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette .it .s { color: var(--t3); font-size: 12px; white-space: nowrap; }
.palette .it.hl { background: var(--sel-list); }
.palette .it .ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--field); color: var(--t2); }
.palette .foot { display: flex; gap: 16px; padding: 8px 16px; border-top: .5px solid var(--hair2); color: var(--t3); font-size: 11px; }

.sheet {
  position: fixed; z-index: 55; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(680px, 92vw); height: min(560px, 86vh);

  animation: sheetIn .24s var(--spring);
}
@keyframes sheetIn { from { opacity: 0; transform: translate(-50%, -48%) scale(.97); } }
.sheet-bar { display: flex; flex-direction: column; align-items: center; padding: 10px 14px 8px; border-bottom: .5px solid var(--hair); background: var(--sidebar); position: relative; }
.sheet-bar .lights { position: absolute; left: 14px; top: 14px; }
.sheet-bar .ttl { font-weight: 600; font-size: 13px; margin-bottom: 8px; }
.sheet-tabs { display: flex; gap: 2px; }
.sheet-tab { width: 76px; padding: 6px 0 5px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--t2); }
.sheet-tab:hover { background: var(--hover); }
.sheet-tab.on { background: var(--sel-side); color: var(--accent-text); }
.sheet-body { flex: 1; overflow: auto; padding: 22px 28px 28px; }
.group-label { font-size: 11.5px; font-weight: 600; color: var(--t3); margin: 18px 4px 6px; }
.group-label:first-child { margin-top: 0; }
.group { background: var(--elev); border-radius: 11px; box-shadow: var(--shadow-card); }
.grow { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 44px; }
.grow + .grow { border-top: .5px solid var(--hair); }
.grow .l { flex: 1; min-width: 0; }
.grow .l small { display: block; color: var(--t3); font-size: 11.5px; margin-top: 1px; }
.switch { width: 32px; height: 19px; border-radius: 10px; background: var(--press); position: relative; transition: background .2s; flex-shrink: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .22s var(--spring); }
.switch.on { background: var(--green); }
.switch.on::after { transform: translateX(13px); }
.appearance { display: flex; gap: 14px; }
.ap { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; color: var(--t2); }
.ap .thumb { width: 66px; height: 44px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 .5px var(--hair2); display: grid; grid-template-columns: 20px 1fr; }
.ap.on .thumb { box-shadow: 0 0 0 2.5px var(--accent); }
.ap.on { color: var(--t1); font-weight: 600; }
.accents { display: flex; gap: 8px; }
.accents button { width: 18px; height: 18px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .2); position: relative; }
.accents button.on::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: #fff; }
.select-btn { height: 26px; padding: 0 8px 0 10px; border-radius: 7px; background: var(--elev2); box-shadow: 0 0 0 .5px var(--hair2), 0 1px 1px rgba(0, 0, 0, .06); display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; }
html[data-theme="light"] .select-btn { background: #fff; }
.agent-row .agent-badge { width: 30px; height: 30px; border-radius: 8px; }
.ok-pill { font-size: 11.5px; color: var(--green); display: inline-flex; align-items: center; gap: 5px; }
.ok-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.ok-pill.off { color: var(--t3); }

/* Notification */
.notif-stack { position: fixed; top: 14px; right: 14px; z-index: 70; display: grid; gap: 8px; width: 356px; }
.notif {
  display: grid; grid-template-columns: 38px 1fr; gap: 11px; padding: 12px 14px 12px 12px; border-radius: 16px;
  background: var(--glass); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
  box-shadow: var(--shadow-pop); animation: notifIn .45s var(--spring);
}
.notif.out { animation: notifOut .3s var(--ease) forwards; }
@keyframes notifIn { from { opacity: 0; transform: translateX(30px); } }
@keyframes notifOut { to { opacity: 0; transform: translateX(30px); } }
.notif .app { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: #0e0e0e; color: #f5f5f5; box-shadow: inset 0 0 0 .5px var(--hair2); }
.notif .h { display: flex; gap: 8px; align-items: baseline; }
.notif .h b { font-weight: 600; font-size: 13px; }
.notif .h span { margin-left: auto; font-size: 11px; color: var(--t3); }
.notif p { color: var(--t2); font-size: 12.5px; margin-top: 1px; line-height: 1.4; }

.avatar { border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-weight: 600; flex-shrink: 0; box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .15); }

@media (max-width: 1180px) { .window { --lw: 300px; --sb: 214px; } .page { padding-left: 32px; padding-right: 32px; } }
@media (max-width: 980px) { .window { --sb: 0px; } .window .floating-lights { opacity: 1; } .window .list .toolbar { padding-left: 84px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>

/* ───────────────────────── State ───────────────────────── */
const S = {
  box: 'inbox',
  repo: null,
  selected: 1,
  inspector: false,
  inspTab: 'activity',
  sidebar: true,
  theme: new URLSearchParams(location.search).get('theme') || 'dark',
  accent: '#ff7a3d',
  defaultAgent: 'claude',
  defaultDepth: 'standard',
  confirmSubmit: true,
  autoReview: false,
  notifyDone: true,
  syncing: false,
  syncedAt: NOW - 2 * 60e3,
  focusFinding: null,
  hero: false,
  logs: {},
}
const Q = new URLSearchParams(location.search)
if (Q.has('bare')) document.body.classList.add('bare')
if (Q.get('box')) S.box = Q.get('box')
if (Q.get('accent')) S.accent = '#' + Q.get('accent')
if (Q.has('hero')) S.hero = true
if (Q.get('inspector')) { S.inspector = true; S.inspTab = Q.get('inspector') }
if (Q.has('nosidebar')) S.sidebar = false
const PREFILL = Number(Q.get('lines') || 0)

const BOXES = [
  { id: 'inbox', label: 'Inbox', icon: 'inbox', match: (p) => ['needs_review', 'ready', 'failed'].includes(p.state) },
  { id: 'reviewing', label: 'Reviewing', icon: 'sparkles', match: (p) => ['reviewing', 'queued'].includes(p.state) },
  { id: 'waiting', label: 'Waiting on author', icon: 'hourglass', match: (p) => p.state === 'waiting' },
  { id: 'mine', label: 'My pull requests', icon: 'user', match: (p) => p.author === ME },
  { id: 'settled', label: 'Settled', icon: 'checkCircle', match: (p) => p.state === 'settled', dim: true },
]

const byId = (id) => PRS.find((p) => p.id === id)
const repoOf = (p) => REPOS.find((r) => r.slug === p.repo)
const inRepo = (p) => !S.repo || p.repo === S.repo
const boxItems = (boxId) => PRS.filter((p) => BOXES.find((b) => b.id === boxId).match(p) && inRepo(p))

/* ───────────────────────── Helpers ───────────────────────── */
const fmtN = (n) => n.toLocaleString('en-US')
function ago(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000)
  if (s < 45) return 'just now'
  if (s < 3600) return `${Math.round(s / 60)}m`
  if (s < 86400) return `${Math.round(s / 3600)}h`
  return `${Math.round(s / 86400)}d`
}
const agoLong = (ts) => { const a = ago(ts); return a === 'just now' ? a : `${a} ago` }
function clock(ts) {
  const s = Math.max(0, Math.floor((Date.now() - ts) / 1000))
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`
}
function staleClass(ts) {
  const d = (Date.now() - ts) / 86400e3
  return d > 5 ? 'rotten' : d > 2.5 ? 'stale' : ''
}
const AV_COLORS = [['#ff9a62', '#e2533b'], ['#7aa7ff', '#4c5bd4'], ['#5fd6a4', '#1f9c74'], ['#d58cff', '#8a46d8'], ['#ffd36b', '#e09a1c'], ['#7fe3ef', '#2f9fb8']]
function avatar(name, size = 20) {
  const h = [...name].reduce((a, c) => a + c.charCodeAt(0), 0) % AV_COLORS.length
  const [a, b] = AV_COLORS[h]
  return `<span class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .45)}px;background:linear-gradient(160deg,${a},${b})">${name[0].toUpperCase()}</span>`
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

function glyph(p, size = 16) {
  const v = `width="${size}" height="${size}" viewBox="0 0 16 16"`
  switch (p.state) {
    case 'needs_review':
      return p.requested
        ? `<svg ${v}><circle cx="8" cy="8" r="6" fill="none" stroke="var(--accent)" stroke-width="1.6"/><circle cx="8" cy="8" r="2.4" fill="var(--accent)"/></svg>`
        : `<svg ${v}><circle cx="8" cy="8" r="6" fill="none" stroke="var(--t3)" stroke-width="1.6" stroke-dasharray="2.6 2.1"/></svg>`
    case 'queued':
      return `<svg ${v}><circle cx="8" cy="8" r="6" fill="none" stroke="var(--t3)" stroke-width="1.6"/><path d="M8 5v3.2l2 1.3" stroke="var(--t2)" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>`
    case 'reviewing':
      return `<svg ${v}><circle cx="8" cy="8" r="6" fill="none" stroke="var(--t4)" stroke-width="1.6"/><path class="spin" d="M8 2a6 6 0 0 1 6 6" stroke="var(--accent)" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`
    case 'ready':
      return `<svg ${v}><circle cx="8" cy="8" r="7" fill="var(--accent)"/><path d="M8 11V5.3M5.6 7.5 8 5.1l2.4 2.4" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`
    case 'failed':
      return `<svg ${v}><circle cx="8" cy="8" r="7" fill="var(--red)"/><path d="M8 4.6v4.1" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><circle cx="8" cy="11.2" r="1" fill="#fff"/></svg>`
    case 'waiting':
      return `<svg ${v}><circle cx="8" cy="8" r="6" fill="none" stroke="var(--purple)" stroke-width="1.6"/><path d="M8 4a4 4 0 0 1 0 8z" fill="var(--purple)"/></svg>`
    case 'settled':
      return `<svg ${v}><circle cx="8" cy="8" r="7" fill="var(--green)"/><path d="m5.2 8.2 1.9 1.9 3.8-4" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`
    case 'authored':
      return `<svg ${v}><circle cx="8" cy="8" r="6" fill="none" stroke="var(--blue)" stroke-width="1.6"/><circle cx="8" cy="8" r="2.4" fill="none" stroke="var(--blue)" stroke-width="1.4"/></svg>`
  }
  return ''
}

const included = (p) => (p.findings || []).filter((f) => f.on && f.status !== 'addressed')
function verdictOf(p) {
  const f = p.findings || []
  if (f.some((x) => x.sev === 'critical')) return 'REQUEST_CHANGES'
  if (f.some((x) => x.sev === 'major')) return 'REQUEST_CHANGES'
  if (f.length) return 'COMMENT'
  return 'APPROVE'
}

/* ───────────────────────── Sidebar ───────────────────────── */
function renderSidebar() {
  const anyRunning = PRS.some((p) => p.state === 'reviewing')
  const boxes = BOXES.map((b) => {
    const n = boxItems(b.id).length
    const hot = b.id === 'inbox' && n > 0
    const extra = b.id === 'reviewing' && anyRunning ? `<svg width="12" height="12" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--t4)" stroke-width="2"/><path class="spin" d="M8 2a6 6 0 0 1 6 6" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>` : ''
    return `<button class="sb-item ${b.dim ? 'dim' : ''} ${S.box === b.id && !S.hero ? 'on' : ''}" data-act="box" data-id="${b.id}">
      ${icon(b.icon)}<span class="label">${b.label}</span><span class="count ${hot ? 'hot' : ''}">${extra}${n || ''}</span></button>`
  }).join('')

  const repos = REPOS.map((r) => {
    const n = PRS.filter((p) => p.repo === r.slug && !['settled'].includes(p.state)).length
    return `<button class="sb-item ${S.repo === r.slug ? 'on' : ''}" data-act="repo" data-id="${r.slug}">
      <span class="repo-dot" style="background:${r.color}"></span><span class="label">${r.name}</span><span class="count">${n}</span></button>`
  }).join('')

  document.getElementById('sidebar').innerHTML = `
    <div class="titlebar">
      <div class="lights"><i></i><i></i><i></i></div>
      <button class="tb-btn" data-act="toggle-sidebar" title="Hide sidebar  ⌘\\">${icon('sidebar')}</button>
      <button class="tb-btn" data-act="new" title="New review  ⌘N">${icon('compose')}</button>
    </div>
    <div class="sb-scroll">
      <button class="sb-search" data-act="palette">${icon('search', 14)}<span>Search</span><kbd>⌘K</kbd></button>
      ${boxes}
      <div class="sb-head"><span>Repositories</span><button data-act="settings" data-tab="repos" title="Add repository">${icon('plus', 14)}</button></div>
      ${repos}
    </div>
    <div class="sb-foot">
      <button class="sync-chip" data-act="sync" title="Sync with GitHub  ⌘R">
        ${S.syncing ? `<svg class="spin" width="12" height="12" viewBox="0 0 16 16"><path d="M8 2a6 6 0 0 1 6 6" stroke="var(--t2)" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span>Syncing…</span>` : `<span class="dot"></span><span>Synced ${agoLong(S.syncedAt)}</span>`}
      </button>
      <button class="tb-btn" data-act="theme" title="Toggle appearance">${icon(S.theme === 'dark' ? 'sun' : 'moon', 15)}</button>
      <button class="tb-btn" data-act="settings" title="Settings  ⌘,">${icon('gear', 15)}</button>
    </div>`
}

/* ───────────────────────── List ───────────────────────── */
function sectionsFor(boxId, items) {
  const oldest = (a, b) => a.updated - b.updated
  if (boxId === 'inbox') {
    return [
      ['Ready to send', items.filter((p) => p.state === 'ready')],
      ['Needs attention', items.filter((p) => p.state === 'failed')],
      ['Requested from you', items.filter((p) => p.state === 'needs_review' && p.requested).sort(oldest)],
      ['Open in your repos', items.filter((p) => p.state === 'needs_review' && !p.requested).sort(oldest)],
    ]
  }
  if (boxId === 'reviewing') {
    return [['Running', items.filter((p) => p.state === 'reviewing')], ['Up next', items.filter((p) => p.state === 'queued').sort((a, b) => a.queuePos - b.queuePos)]]
  }
  if (boxId === 'waiting') {
    return [['New commits since your review', items.filter((p) => p.newCommits)], ['Waiting', items.filter((p) => !p.newCommits)]]
  }
  return [[null, items]]
}

function rowTag(p) {
  switch (p.state) {
    case 'ready': return `<span class="chip" style="--c:var(--accent)">${included(p).length} findings</span>`
    case 'reviewing': return `<span class="chip ghost mono" style="--c:var(--accent)" data-clock="${p.startedAt}">${clock(p.startedAt)}</span>`
    case 'queued': return `<span class="chip">Queued · ${p.queuePos}</span>`
    case 'failed': return `<span class="chip" style="--c:var(--red)">Failed</span>`
    case 'waiting': return p.newCommits ? `<span class="chip" style="--c:var(--purple)">+${p.newCommits} commits</span>` : `<span class="chip ghost">${(p.findings || []).filter((f) => f.status === 'pending').length} open</span>`
    case 'settled': return `<span class="chip ghost">${p.submitted?.event === 'APPROVE' ? 'Approved' : 'Merged'}</span>`
    case 'authored': return `<span class="chip ghost">${p.reviewers.length} reviewers</span>`
    default: return `<span class="diffstat"><span class="a">+${fmtN(p.add)}</span><span class="d">−${fmtN(p.del)}</span></span>`
  }
}

function renderList() {
  const box = BOXES.find((b) => b.id === S.box)
  const items = boxItems(S.box)
  const repo = S.repo ? REPOS.find((r) => r.slug === S.repo) : null
  const subtitle = {
    inbox: items.length ? `${items.length} need you` : 'All clear',
    reviewing: `${items.filter((p) => p.state === 'reviewing').length} running · ${items.filter((p) => p.state === 'queued').length} queued`,
    waiting: `${items.length} with authors`,
    mine: `${items.length} open`,
    settled: 'Last 30 days',
  }[S.box]

  let body = ''
  if (!items.length) {
    body = `<div class="list-empty"><div class="big">${icon('check', 26, '', 2.2)}</div><b>${S.box === 'inbox' ? 'Inbox zero' : 'Nothing here'}</b><span>${S.box === 'inbox' ? 'Every pull request that needs you has been handled.' : 'Pull requests will show up here when they match.'}</span></div>`
  } else {
    body = sectionsFor(S.box, items).filter(([, list]) => list.length).map(([label, list]) => `
      ${label ? `<div class="section-label">${label}<span class="n">${list.length}</span></div>` : ''}
      ${list.map((p) => rowHtml(p)).join('')}`).join('')
  }

  document.getElementById('list').innerHTML = `
    <div class="toolbar">
      <div class="ttl"><h2>${box.label}${repo ? ` <span style="color:var(--t3);font-weight:500">· ${repo.name}</span>` : ''}</h2><div class="sub">${subtitle}</div></div>
      ${repo ? `<button class="tb-btn" data-act="repo" data-id="${repo.slug}" title="Show all repositories">${icon('x', 14)}</button>` : ''}
      <button class="tb-btn" data-act="filter-menu" title="Filter and sort">${icon('filter')}</button>
    </div>
    <div class="rows" id="rows">${body}</div>`
}

function rowHtml(p) {
  const r = repoOf(p)
  return `<button class="row ${S.selected === p.id && !S.hero ? 'on' : ''}" data-act="select" data-id="${p.id}" data-row="${p.id}">
    <span class="glyph">${glyph(p)}</span>
    <span class="title">${esc(p.title)}</span>
    <span class="age ${['needs_review'].includes(p.state) ? staleClass(p.updated) : ''}">${ago(p.updated)}</span>
    <span class="meta"><span class="repo-dot sm" style="background:${r.color}"></span>${r.name} #${p.num}<span style="color:var(--t4)">·</span><span class="who">${p.author === ME ? 'you' : p.author}</span></span>
    <span class="tag">${rowTag(p)}</span>
  </button>`
}

/* ───────────────────────── Detail ───────────────────────── */
function renderDetail() {
  const el = document.getElementById('detail')
  const p = byId(S.selected)
  if (S.hero || !p) { el.innerHTML = heroHtml(); return }
  const r = repoOf(p)
  const st = STATES[p.state]

  const kicker = `<div class="kicker" style="--d:0"><span class="state" style="--c:${st.color}">${glyph(p, 14)}${st.label}</span><span style="color:var(--t4)">·</span><span>${r.slug} #${p.num}</span></div>`
  const header = `
    ${kicker}
    <h1 class="pr-title" style="--d:1">${esc(p.title)}</h1>
    <div class="byline" style="--d:2">${avatar(p.author, 20)}<b>${p.author === ME ? 'You' : p.author}</b><span>want${p.author === ME ? '' : 's'} to merge ${p.commits} commit${p.commits === 1 ? '' : 's'} into</span><span class="ref">${p.base}</span><span>from</span><span class="ref">${p.head}</span></div>
    <div class="stats" style="--d:3">
      <span class="stat"><span class="diffstat"><span class="a">+${fmtN(p.add)}</span><span class="d">−${fmtN(p.del)}</span></span></span>
      <span class="stat">${icon('files', 14)}${p.fileList.length} files</span>
      <span class="stat" style="--c:${p.checks === 'pass' ? 'var(--green)' : p.checks === 'fail' ? 'var(--red)' : 'var(--orange)'}">${icon(p.checks === 'pass' ? 'checkCircle' : p.checks === 'fail' ? 'warn' : 'hourglass', 14)}${p.checks === 'pass' ? 'Checks passing' : p.checks === 'fail' ? 'Checks failing' : 'Checks running'}</span>
      ${p.requested ? `<span class="stat" style="--c:var(--accent)">${icon('user', 14)}Requested you</span>` : ''}
      <span class="stat">${icon('hourglass', 14)}Updated ${agoLong(p.updated)}</span>
    </div>`

  const brief = p.brief ? `
    <div class="block" style="--d:4">
      <div class="block-head"><h3>What changed</h3><span class="aside"><span class="ai-mark">${icon('sparkles', 12)}Brief</span></span></div>
      <div class="card brief">
        <ul>${p.brief.changes.map((c) => `<li><span>${c}</span></li>`).join('')}</ul>
        ${p.brief.risks.length ? `<div class="risks"><span class="lbl">Watch for</span>${p.brief.risks.map((x) => `<span class="chip" style="--c:var(--orange)">${x}</span>`).join('')}</div>` : ''}
      </div>
    </div>` : ''

  let main = ''
  if (p.state === 'reviewing') main = `<div class="block" style="--d:5"><div class="block-head"><h3>Review in progress</h3></div>${runCard(p)}</div>`
  if (p.state === 'queued') main = `<div class="block" style="--d:5"><div class="card callout" style="--c:var(--t2)"><div class="ico">${icon('hourglass', 18)}</div><div><div class="what">Queued · position ${p.queuePos}</div><div class="why">${AGENTS[p.agent].label} will pick this up after the current review finishes.</div></div><button class="btn" data-act="dequeue">Remove from queue</button></div></div>`
  if (p.state === 'failed') main = `<div class="block" style="--d:5"><div class="card callout" style="--c:var(--red)"><div class="ico">${icon('warn', 18)}</div><div><div class="what">Review failed after ${p.attempts} attempts</div><div class="why">${p.failure}</div></div></div></div>`
  if (p.state === 'ready' || p.state === 'waiting' || (p.state === 'settled' && p.findings)) main = verdictCard(p) + findingsBlock(p)
  if (p.state === 'waiting' && p.newCommits) {
    main = `<div class="block" style="--d:5"><div class="card callout" style="--c:var(--purple)"><div class="ico">${icon('branch', 18)}</div><div><div class="what">${p.newCommits} new commits since your review</div><div class="why">${p.author} pushed changes ${agoLong(p.updated)}. Re-review only what changed, and Ordem will check which findings were addressed.</div></div></div></div>` + main
  }
  if (p.state === 'settled' && !p.findings) main = `<div class="block" style="--d:5"><div class="card callout" style="--c:var(--green)"><div class="ico">${icon('checkCircle', 18)}</div><div><div class="what">${p.settledHow}</div><div class="why">Nothing left to do here.</div></div></div></div>`
  if (p.state === 'authored') main = `<div class="block" style="--d:5"><div class="card callout" style="--c:var(--blue)"><div class="ico">${icon('user', 18)}</div><div><div class="what">Waiting on ${p.reviewers.join(' and ')}</div><div class="why">Run a self-review before they get to it — findings stay private until you choose to act on them.</div></div></div></div>`

  if (['needs_review', 'authored', 'failed', 'queued'].includes(p.state)) main += filesBlock(p)

  el.innerHTML = `
    <div class="toolbar">
      <div class="crumbs"><span class="repo-dot sm" style="background:${r.color}"></span><span>${r.name}</span>${icon('chevRight', 12)}<b>#${p.num} ${esc(p.title)}</b></div>
      <button class="tb-btn" title="Open on GitHub">${icon('github', 15)}</button>
      <button class="tb-btn" data-act="pr-menu" title="More">${icon('more')}</button>
      <button class="tb-btn ${S.inspector ? 'on' : ''}" data-act="toggle-inspector" title="Inspector  I">${icon('inspector')}</button>
    </div>
    <div class="scroll" id="scroll"><div class="page">${header}${brief}${main}</div></div>
    ${composerHtml(p)}`
  autosize()
}

function diffBars(a, d, max) {
  const total = a + d
  const blocks = Math.max(1, Math.round((total / max) * 5))
  const adds = Math.round((a / Math.max(total, 1)) * blocks)
  return `<span class="bars">${Array.from({ length: 5 }, (_, i) => `<i class="${i < adds ? 'a' : i < blocks ? 'd' : ''}"></i>`).join('')}</span>`
}

function filesBlock(p) {
  const max = Math.max(...p.fileList.map((f) => f.a + f.d))
  return `<div class="block" style="--d:6">
    <div class="block-head"><h3>Files</h3><span class="aside">${p.fileList.length} changed</span></div>
    <div class="card" style="padding:6px">${p.fileList.map((f) => {
      const parts = f.path.split('/')
      const name = parts.pop()
      return `<div class="file-line">${icon('file', 14)}<span class="fp"><b>${name}</b><span>${parts.join('/')}</span></span><span class="diffstat"><span class="a">+${f.a}</span><span class="d">−${f.d}</span></span>${diffBars(f.a, f.d, max)}</div>`
    }).join('')}</div>
  </div>`
}

function verdictCard(p) {
  const v = EVENTS[p.state === 'ready' ? verdictOf(p) : p.submitted?.event || verdictOf(p)]
  const counts = Object.keys(SEV).map((k) => [k, (p.findings || []).filter((f) => f.sev === k).length]).filter(([, n]) => n)
  const head = p.state === 'ready'
    ? `${AGENTS[p.agent].label} suggests <em style="--c:${v.color}">${v.label.toLowerCase()}</em>`
    : `You ${p.submitted.event === 'APPROVE' ? 'approved' : p.submitted.event === 'COMMENT' ? 'commented' : 'requested changes'} ${agoLong(p.submitted.at)}`
  const why = p.state === 'ready'
    ? (p.findings.find((f) => f.sev === 'critical') ? `${p.findings.find((f) => f.sev === 'critical').title}. ${counts.length > 1 ? 'Plus a few smaller things.' : ''}` : 'No blockers — a couple of things worth mentioning.')
    : `${(p.findings || []).filter((f) => f.status === 'addressed').length} of ${(p.findings || []).length} findings addressed so far.`
  return `<div class="block" style="--d:5">
    <div class="block-head"><h3>Review</h3><span class="aside"><button class="link" data-act="open-log">View log</button></span></div>
    <div class="card">
      <div class="verdict">
        <div class="agent-badge">${agentIcon(p.agent, 20)}</div>
        <div><div class="what">${head}</div><div class="why">${why}</div>
          <div class="meta">${AGENTS[p.agent].label} ${AGENTS[p.agent].model}<span>·</span>${DEPTHS[p.depth].label}<span>·</span>${p.run.duration}<span>·</span>${agoLong(p.run.at)}</div></div>
      </div>
      <div class="sev-summary">${counts.map(([k, n]) => `<span class="chip" style="--c:${SEV[k].color}">${n} ${SEV[k].label.toLowerCase()}</span>`).join('')}</div>
    </div>
  </div>`
}

function findingsBlock(p) {
  const list = p.findings || []
  const editable = p.state === 'ready'
  const groups = Object.keys(SEV).map((k) => [k, list.filter((f) => f.sev === k)]).filter(([, l]) => l.length)
  return `<div class="block" style="--d:6">
    <div class="block-head"><h3>Findings</h3><span class="aside">${editable ? `<span>${included(p).length} of ${list.length} included</span><button class="link" data-act="include-all">${list.every((f) => f.on) ? 'Exclude all' : 'Include all'}</button>` : ''}</span></div>
    ${groups.map(([k, l]) => `
      <div class="finding-group"><span class="chip" style="--c:${SEV[k].color}">${SEV[k].label}</span><span>${l.length}</span></div>
      ${l.map((f) => findingHtml(p, f, editable)).join('')}`).join('')}
  </div>`
}

function findingHtml(p, f, editable) {
  const leading = editable
    ? `<button class="check ${f.on ? 'on' : ''}" data-act="toggle-finding" data-id="${f.id}" title="Include in review  X">${icon('check', 12, '', 3)}</button>`
    : `<span style="padding-top:1px">${f.status === 'addressed' ? `<svg width="18" height="18" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="var(--green)"/><path d="m5.2 8.2 1.9 1.9 3.8-4" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>` : `<svg width="18" height="18" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--t3)" stroke-width="1.5"/></svg>`}</span>`
  const fix = f.fix ? `<div class="diff"><div class="hd">${icon('wand', 12)}Suggested change</div>${f.fix.map(([t, l]) => `<div class="l ${t}">${esc(l)}</div>`).join('')}</div>` : ''
  return `<div class="finding ${editable && !f.on ? 'off' : ''} ${S.focusFinding === f.id ? 'focus' : ''} ${f.status === 'addressed' ? 'addressed' : ''}" data-act="focus-finding" data-id="${f.id}">
    ${leading}
    <div>
      <div class="top"><span class="f-title">${f.title}</span><span class="f-loc">${f.file.split('/').pop()}:${f.line}</span></div>
      <div class="f-body">${f.body}</div>
      ${fix}
      ${editable ? `<div class="f-actions"><button class="tb-btn">${icon('compose', 13)}Edit</button><button class="tb-btn">${icon('file', 13)}Open file</button><button class="tb-btn">${icon('message', 13)}Ask ${AGENTS[p.agent].label}</button></div>` : ''}
    </div>
  </div>`
}

const STEP_LABELS = ['Prepare worktree', 'Read the diff', 'Review changes', 'Write findings']
function runCard(p) {
  const run = S.logs[p.id] || { lines: [] }
  const statusCount = run.lines.filter(([t]) => t === 'status').length
  const current = Math.max(0, statusCount - 1)
  const nowLine = [...run.lines].reverse().find(([t]) => t === 'out' || t === 'status')
  const steps = STEP_LABELS.map((label, i) => {
    const done = i < current
    const now = i === current
    const dot = done
      ? `<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="var(--green)"/><path d="m5.2 8.2 1.9 1.9 3.8-4" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      : now ? `<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--t4)" stroke-width="1.6"/><path class="spin" d="M8 2a6 6 0 0 1 6 6" stroke="var(--accent)" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`
        : `<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--t4)" stroke-width="1.5" stroke-dasharray="2.4 2"/></svg>`
    const text = now && nowLine ? `<span class="shimmer">${label} — ${esc(nowLine[1].replace(/^\[\w+\] /, ''))}</span>` : label
    return `<div class="step ${done ? 'done' : now ? 'now' : ''}"><span class="d">${dot}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${text}</span></div>`
  }).join('')
  return `<div class="card run" id="run-${p.id}">
    <div class="run-head">
      <div class="agent-badge">${agentIcon(p.agent, 20)}</div>
      <div><div class="what">${AGENTS[p.agent].label} is reviewing</div><div class="sub">${AGENTS[p.agent].model} · ${DEPTHS[p.depth].label}${p.lens !== 'general' ? ` · ${LENSES[p.lens].label} lens` : ''}</div></div>
      <span class="clock" data-clock="${p.startedAt}">${clock(p.startedAt)}</span>
    </div>
    <div class="steps">${steps}</div>
    <div class="log">${run.lines.slice(-7).map(([t, l]) => `<div class="ln ${t}">${t === 'status' ? '→ ' : t === 'ok' ? '✓ ' : '  '}${esc(l)}</div>`).join('')}</div>
  </div>`
}

function composerHtml(p) {
  if (p.state === 'settled') return ''
  const agent = AGENTS[p.agent || S.defaultAgent]
  const agentId = p.agent || S.defaultAgent
  const depth = DEPTHS[p.depth || S.defaultDepth]
  const lens = LENSES[p.lens || 'general']
  const hint = (items) => `<div class="composer-hint">${items.map(([k, t]) => `<span><kbd>${k}</kbd> ${t}</span>`).join('')}</div>`
  const startBar = (label, sendLabel) => `
      <textarea id="composer-input" rows="2" placeholder="${label}">${esc(p.focus || '')}</textarea>
      <div class="bar">
        <button class="pill" data-act="menu-agent">${agentIcon(agentId, 14)}${agent.label} ${agent.model}${icon('chevDown', 12, 'chev')}</button>
        <span class="vsep"></span>
        <button class="pill" data-act="menu-depth">${icon(depth.icon, 14)}${depth.label}${icon('chevDown', 12, 'chev')}</button>
        <span class="vsep"></span>
        <button class="pill" data-act="menu-lens">${icon(lens.icon, 14)}${lens.label}${icon('chevDown', 12, 'chev')}</button>
        ${sendLabel ? `<button class="send wide" data-act="send">${sendLabel}<kbd>⌘↵</kbd></button>` : `<button class="send" data-act="send" title="Start review  ⌘↵">${icon('arrowUp', 17, '', 2.2)}</button>`}
      </div>`

  if (p.state === 'ready') {
    const ev = EVENTS[p.event || verdictOf(p)]
    const n = included(p).length
    return `<div class="composer-wrap"><div class="composer">
      <textarea id="composer-input" rows="2" placeholder="Add a summary for ${p.author} (optional)…">${esc(p.draft || '')}</textarea>
      <div class="bar">
        <button class="pill" data-act="menu-event"><span class="swatch" style="--c:${ev.color}"></span>${ev.label}${icon('chevDown', 12, 'chev')}</button>
        <span class="vsep opt2"></span>
        <span class="pill opt2" style="pointer-events:none">${icon('message', 14)}${n} inline comment${n === 1 ? '' : 's'}</span>
        <span class="vsep opt"></span>
        <span class="pill opt" style="pointer-events:none">${icon('sparkles', 14)}Summary drafted by ${AGENTS[p.agent].label}</span>
        <button class="send wide" data-act="submit">Submit review<kbd>⌘↵</kbd></button>
      </div>
    </div>${hint([['X', 'include finding'], ['J K', 'move'], ['⌘↵', 'submit to GitHub']])}</div>`
  }
  if (p.state === 'reviewing') {
    return `<div class="composer-wrap"><div class="composer">
      <textarea rows="2" disabled placeholder="${agent.label} is reviewing. You’ll get a notification when findings are ready — feel free to move on."></textarea>
      <div class="bar">
        <span class="pill" style="pointer-events:none">${agentIcon(agentId, 14)}${agent.label} ${agent.model}</span>
        <span class="vsep"></span>
        <span class="pill" style="pointer-events:none">${icon(depth.icon, 14)}${depth.label}</span>
        <button class="send stop wide" data-act="stop" style="padding:0 14px">${icon('stop', 14)}Stop</button>
      </div>
    </div></div>`
  }
  if (p.state === 'queued') return ''
  if (p.state === 'waiting') {
    return `<div class="composer-wrap"><div class="composer">${startBar('Anything to check in the new commits? (optional)', `${icon('refresh', 14)}Re-review`)}</div></div>`
  }
  if (p.state === 'failed') {
    return `<div class="composer-wrap"><div class="composer">${startBar(`Anything ${agent.label} should focus on? (optional)`, `${icon('refresh', 14)}Retry review`)}</div></div>`
  }
  if (p.state === 'authored') {
    return `<div class="composer-wrap"><div class="composer">${startBar('Self-review before your reviewers do — anything to focus on?', null)}</div>${hint([['⌘↵', 'start self-review'], ['⌘K', 'search']])}</div>`
  }
  return `<div class="composer-wrap"><div class="composer">${startBar(`Anything ${agent.label} should focus on? e.g. “check the migration is safe to run online”`, null)}</div>${hint([['⌘↵', 'start review'], ['J K', 'next / previous'], ['E', 'archive']])}</div>`
}

function heroHtml() {

        <button class="pill" data-act="menu-agent">${agentIcon(S.defaultAgent, 14)}${AGENTS[S.defaultAgent].label} ${AGENTS[S.defaultAgent].model}${icon('chevDown', 12, 'chev')}</button>
        <span class="vsep"></span>
        <button class="pill" data-act="menu-depth">${icon(DEPTHS[S.defaultDepth].icon, 14)}${DEPTHS[S.defaultDepth].label}${icon('chevDown', 12, 'chev')}</button>

      ${newCommits.length ? `<button class="suggestion" data-act="box" data-id="waiting">${icon('branch', 14)}${newCommits.length} PR${newCommits.length > 1 ? 's' : ''} with new commits</button>` : ''}
