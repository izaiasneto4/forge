# Example Kamal configuration for a private Ordem deployment.
# Replace all placeholder hosts, registry values, and secrets before use.
# This file is not a production-ready deployment recipe as checked in.
# Kamal is a standalone tool: install it with `gem install kamal` or use its Docker image.

# Name of your application. Used to uniquely configure containers.
service: ordem

# Name of the container image (use your-user/app-name on external registries).
image: ordem

# Deploy to these servers. The Bun server runs the job worker in-process.
servers:
  web:
    - 203.0.113.10

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
#
# proxy:
#   ssl: true
#   host: app.example.com

# Where you keep your container images.
registry:
  # Alternatives: hub.docker.com / registry.digitalocean.com / ghcr.io / ...
  server: registry.example.com

  # Needed for authenticated registries.
  # username: your-user

  # Always use an access token rather than real password when possible.
  # password:
  #   - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  clear:
    # Hosts allowed to reach the app (comma list, ".example.com" for subdomains).
    # Production allows every host when unset.
    # ORDEM_ALLOWED_HOSTS: app.example.com

    # Log verbosity: debug, info, warn, error.
    # ORDEM_LOG_LEVEL: info

# Aliases are triggered with "kamal <alias>".
aliases:
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  ordem: app exec --interactive --reuse "bun backend/bin/ordem.ts"

# Use a persistent storage volume for the SQLite database.
# Recommended to change this to a mounted volume path that is backed up off server.
# Existing deployments should keep their current storage volume name.
volumes:
  - "ordem_storage:/app/storage"

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server

# Use a different ssh user than root
# ssh:
#   user: app
